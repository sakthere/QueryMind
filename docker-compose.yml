services:
  analytics-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: querymind_analytics
      POSTGRES_USER: querymind_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports: ["5432:5432"]
    volumes:
      - analytics-data:/var/lib/postgresql/data
      - ./infra/postgres/01-schema-and-seed.sql:/docker-entrypoint-initdb.d/01-schema-and-seed.sql:ro
  app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: querymind_app
      POSTGRES_USER: querymind_app
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-local-dev-only}
    ports: ["5433:5432"]
volumes:
  analytics-data:
