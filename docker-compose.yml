services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports: ["1433:1433"]
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  sql-init:
    image: mcr.microsoft.com/mssql-tools18:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      ANALYTICS_READER_PASSWORD: ${ANALYTICS_READER_PASSWORD:?Set ANALYTICS_READER_PASSWORD in .env}
    volumes:
      - ./infra/sqlserver/01-schema-and-seed.sql:/scripts/01-schema-and-seed.sql:ro
    command: ["/bin/sh", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -v \"AnalyticsReaderPassword=$$ANALYTICS_READER_PASSWORD\" -i /scripts/01-schema-and-seed.sql"]
    restart: "no"
volumes:
  sqlserver-data:
